x-api-environment: &api-environment
  NODE_ENV: production
  ROOMFRAME_DB_HOST: postgres
  ROOMFRAME_DB_PORT: "5432"
  ROOMFRAME_DB_NAME: roomframe
  ROOMFRAME_DB_USER: roomframe_runtime
  ROOMFRAME_DB_PASSWORD_FILE: /run/secrets/postgres_runtime_password
  ROOMFRAME_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
  ROOMFRAME_SESSION_SECRET_FILE: /run/secrets/session_secret
  ROOMFRAME_TOTP_KEY_FILE: /run/secrets/totp_encryption_key
  ROOMFRAME_VERSION: ${ROOMFRAME_VERSION:-dev}
  ROOMFRAME_MEDIA_DIR: /data/media
  ROOMFRAME_PROCESSING_DIR: /data/processing
  ROOMFRAME_RELEASES_DIR: /data/releases
  ROOMFRAME_BACKUPS_DIR: /data/backups
  ROOMFRAME_DEFAULT_BUNDLE_DIR: /defaults/experience
  ROOMFRAME_SERVER_STATE_FILE: /run/roomframe/server-state.json
  ROOMFRAME_UPDATE_TRUST_DIR: /run/roomframe/update-trust
  ROOMFRAME_TV_CLIENT_CA_FILE: /run/roomframe/tv-client-ca.crt
  ROOMFRAME_SERVER_CA_FILE: /run/roomframe/server-ca/ca.crt
  ROOMFRAME_UPDATE_GITHUB_REPOSITORY: ${ROOMFRAME_UPDATE_GITHUB_REPOSITORY:-}
  ROOMFRAME_UPDATE_GITHUB_CHANNEL: ${ROOMFRAME_UPDATE_GITHUB_CHANNEL:-stable}
  ROOMFRAME_UPDATE_POLL_MINUTES: ${ROOMFRAME_UPDATE_POLL_MINUTES:-360}
  ROOMFRAME_UPDATE_REQUEST_TIMEOUT_MS: ${ROOMFRAME_UPDATE_REQUEST_TIMEOUT_MS:-60000}
  ROOMFRAME_WEATHER_GATEWAY_URL: http://weather-gateway:8091
  ROOMFRAME_WEATHER_REQUEST_TIMEOUT_MS: ${ROOMFRAME_WEATHER_REQUEST_TIMEOUT_MS:-8000}
  ROOMFRAME_WEATHER_CACHE_MINUTES: ${ROOMFRAME_WEATHER_CACHE_MINUTES:-15}
  ROOMFRAME_RECOVERY_REQUEST_FILE: /run/roomframe/recovery/request.json
  ROOMFRAME_PUBLIC_URL: ${ROOMFRAME_PUBLIC_URL:?ROOMFRAME_PUBLIC_URL requis}
  ROOMFRAME_PREFERRED_URL: ${ROOMFRAME_PREFERRED_URL:?ROOMFRAME_PREFERRED_URL requis}
  ROOMFRAME_FALLBACK_URL: ${ROOMFRAME_FALLBACK_URL:?ROOMFRAME_FALLBACK_URL requis}
  ROOMFRAME_API_URL: ${ROOMFRAME_API_URL:?ROOMFRAME_API_URL requis}
  ROOMFRAME_SERVER_IP: ${ROOMFRAME_SERVER_IP:?ROOMFRAME_SERVER_IP requis}
  ROOMFRAME_PRIMARY_HOST: ${ROOMFRAME_PRIMARY_HOST:?ROOMFRAME_PRIMARY_HOST requis}
  TZ: ${ROOMFRAME_TIMEZONE:-UTC}

x-api-build: &api-build
  context: .
  dockerfile: services/api/Dockerfile

x-api-secrets: &api-secrets
  - postgres_runtime_password
  - bootstrap_token
  - session_secret
  - totp_encryption_key

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./prototype/admin:/srv/admin:ro
      - ./prototype/tv:/srv/simulator:ro
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/pki/discovery:/srv/discovery:ro
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/caddy:/data
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/caddy-config:/config
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/pki/tv-client-ca/ca.crt:/etc/roomframe/tv-client-ca.crt:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ROOMFRAME_CADDY_MEMORY_LIMIT:-256m}
    cpus: ${ROOMFRAME_CADDY_CPU_LIMIT:-0.50}
    pids_limit: 128
    networks:
      - frontend
      - ingress

  api:
    build: *api-build
    image: roomframe-api:${ROOMFRAME_VERSION:-dev}
    restart: unless-stopped
    user: "${ROOMFRAME_RUNTIME_UID:?ROOMFRAME_RUNTIME_UID requis}:${ROOMFRAME_RUNTIME_GID:?ROOMFRAME_RUNTIME_GID requis}"
    read_only: true
    environment: *api-environment
    secrets: *api-secrets
    volumes:
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/app/recovery:/run/roomframe/recovery:ro
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/media:/data/media
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/processing:/data/processing
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/releases:/data/releases
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/seed/default-experience:/defaults/experience:ro
      - ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/server-state.json:/run/roomframe/server-state.json:ro
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/pki/update-trust:/run/roomframe/update-trust:ro
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/pki/tv-client-ca/ca.crt:/run/roomframe/tv-client-ca.crt:ro
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/pki/server-ca:/run/roomframe/server-ca:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      migrate:
        condition: service_completed_successfully
      weather-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${ROOMFRAME_API_MEMORY_LIMIT:-768m}
    cpus: ${ROOMFRAME_API_CPU_LIMIT:-1.00}
    pids_limit: 256
    networks:
      - frontend
      - backend

  worker:
    build: *api-build
    image: roomframe-api:${ROOMFRAME_VERSION:-dev}
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    user: "${ROOMFRAME_RUNTIME_UID:?ROOMFRAME_RUNTIME_UID requis}:${ROOMFRAME_RUNTIME_GID:?ROOMFRAME_RUNTIME_GID requis}"
    read_only: true
    environment: *api-environment
    secrets:
      - postgres_runtime_password
    volumes:
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/media:/data/media
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/processing:/data/processing
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${ROOMFRAME_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${ROOMFRAME_WORKER_CPU_LIMIT:-2.00}
    pids_limit: 512
    networks:
      - backend

  weather-gateway:
    build: *api-build
    image: roomframe-api:${ROOMFRAME_VERSION:-dev}
    command: ["npm", "run", "weather-gateway"]
    restart: unless-stopped
    user: "${ROOMFRAME_RUNTIME_UID:?ROOMFRAME_RUNTIME_UID requis}:${ROOMFRAME_RUNTIME_GID:?ROOMFRAME_RUNTIME_GID requis}"
    read_only: true
    environment:
      NODE_ENV: production
      PORT: "8091"
      ROOMFRAME_WEATHER_PROVIDER_MODE: ${ROOMFRAME_WEATHER_PROVIDER_MODE:-evaluation}
      ROOMFRAME_WEATHER_REQUEST_TIMEOUT_MS: ${ROOMFRAME_WEATHER_REQUEST_TIMEOUT_MS:-8000}
      ROOMFRAME_WEATHER_API_KEY_FILE: /run/secrets/weather_api_key
    secrets:
      - weather_api_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${ROOMFRAME_WEATHER_MEMORY_LIMIT:-192m}
    cpus: ${ROOMFRAME_WEATHER_CPU_LIMIT:-0.25}
    pids_limit: 96
    networks:
      - backend
      - weather-egress

  update-poller:
    build: *api-build
    image: roomframe-api:${ROOMFRAME_VERSION:-dev}
    command: ["npm", "run", "update-poller"]
    restart: unless-stopped
    user: "${ROOMFRAME_RUNTIME_UID:?ROOMFRAME_RUNTIME_UID requis}:${ROOMFRAME_RUNTIME_GID:?ROOMFRAME_RUNTIME_GID requis}"
    read_only: true
    environment: *api-environment
    secrets:
      - postgres_runtime_password
    volumes:
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/processing:/data/processing
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/releases:/data/releases
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/pki/update-trust:/run/roomframe/update-trust:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${ROOMFRAME_UPDATE_POLLER_MEMORY_LIMIT:-384m}
    cpus: ${ROOMFRAME_UPDATE_POLLER_CPU_LIMIT:-0.50}
    pids_limit: 128
    networks:
      - backend
      - update-egress

  database-roles:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    command: ["/opt/roomframe/postgres-bootstrap-roles.sh"]
    restart: "no"
    environment:
      ROOMFRAME_DB_HOST: postgres
      ROOMFRAME_DB_PORT: "5432"
      ROOMFRAME_DB_NAME: roomframe
      ROOMFRAME_DB_ADMIN_USER: roomframe
      ROOMFRAME_DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./scripts/postgres-bootstrap-roles.sh:/opt/roomframe/postgres-bootstrap-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    networks:
      - backend

  migrate:
    build: *api-build
    image: roomframe-api:${ROOMFRAME_VERSION:-dev}
    command: ["npm", "run", "migrate"]
    restart: "no"
    user: "${ROOMFRAME_RUNTIME_UID:?ROOMFRAME_RUNTIME_UID requis}:${ROOMFRAME_RUNTIME_GID:?ROOMFRAME_RUNTIME_GID requis}"
    read_only: true
    environment:
      NODE_ENV: production
      ROOMFRAME_DB_HOST: postgres
      ROOMFRAME_DB_PORT: "5432"
      ROOMFRAME_DB_NAME: roomframe
      ROOMFRAME_DB_USER: roomframe_migrator
      ROOMFRAME_DB_PASSWORD_FILE: /run/secrets/postgres_migrator_password
      ROOMFRAME_DB_MIGRATION_ROLE: roomframe_owner
      ROOMFRAME_DB_RUNTIME_ROLE: roomframe_runtime
      ROOMFRAME_MIGRATIONS_DIR: /app/database/migrations
    secrets:
      - postgres_migrator_password
    depends_on:
      database-roles:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 96
    networks:
      - backend

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomframe
      POSTGRES_USER: roomframe
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${ROOMFRAME_TIMEZONE:-UTC}
    secrets:
      - postgres_password
      - postgres_migrator_password
      - postgres_runtime_password
    volumes:
      - ${ROOMFRAME_DATA_DIR:-/var/lib/roomframe}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ROOMFRAME_POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${ROOMFRAME_POSTGRES_CPU_LIMIT:-1.00}
    pids_limit: 256
    networks:
      - backend

networks:
  frontend:
    internal: true
  backend:
    internal: true
  ingress:
  update-egress:
  weather-egress:

secrets:
  postgres_password:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/postgres_password
  postgres_migrator_password:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/postgres_migrator_password
  postgres_runtime_password:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/postgres_runtime_password
  bootstrap_token:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/bootstrap_token
  session_secret:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/session_secret
  totp_encryption_key:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/totp_encryption_key
  weather_api_key:
    file: ${ROOMFRAME_CONFIG_DIR:-/etc/roomframe}/secrets/weather_api_key
