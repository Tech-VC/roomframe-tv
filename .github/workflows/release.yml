name: release-assets

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age ripgrep
      - name: Check and test the tagged sources
        run: |
          ./scripts/test.sh
          sudo ./scripts/test-backup-encryption.sh
          sudo ./scripts/test-backup-verify-e2e.sh
          sudo ./scripts/test-discovery.sh
          ./scripts/test-supply-chain.sh

  package:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Verify tag provenance and version consistency
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Le commit tagué n'appartient pas à la branche main protégée." >&2
            exit 1
          }
          tag_version="${GITHUB_REF_NAME#v}"
          install_version="$(awk -F'"' '$1 == "ROOMFRAME_VERSION=" {print $2; exit}' install.sh)"
          api_version="$(node -p "require('./services/api/package.json').version")"
          android_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' apps/tv-android/app/build.gradle.kts)"
          [[ "$GITHUB_REF_NAME" == "v${tag_version}" && -n "$tag_version" ]]
          [[ "$tag_version" == "$install_version" ]] || {
            echo "Le tag et install.sh annoncent des versions différentes." >&2
            exit 1
          }
          [[ "$tag_version" == "$api_version" ]] || {
            echo "Le tag et services/api/package.json annoncent des versions différentes." >&2
            exit 1
          }
          [[ "$tag_version" == "$android_version" ]] || {
            echo "Le tag et l'application Android TV annoncent des versions différentes." >&2
            exit 1
          }
      - name: Build and verify signed Android TV application
        env:
          ANDROID_SIGNING_STORE_B64: ${{ secrets.ROOMFRAME_ANDROID_SIGNING_STORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ROOMFRAME_ANDROID_SIGNING_STORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_SIGNING_STORE_B64" || -z "$ANDROID_SIGNING_STORE_PASSWORD" ]]; then
            echo "Les secrets de signature Android TV sont requis pour publier." >&2
            exit 1
          fi
          signing_store="$RUNNER_TEMP/roomframe-tv-production-v1.p12"
          trap 'rm -f "$signing_store"' EXIT
          umask 077
          printf '%s' "$ANDROID_SIGNING_STORE_B64" | base64 --decode >"$signing_store"
          chmod 0600 "$signing_store"
          export ROOMFRAME_ANDROID_SIGNING_STORE="$signing_store"
          export ROOMFRAME_ANDROID_SIGNING_STORE_PASSWORD="$ANDROID_SIGNING_STORE_PASSWORD"
          export ROOMFRAME_ANDROID_SIGNING_KEY_ALIAS="roomframe-tv-production-v1"
          export ROOMFRAME_ANDROID_SIGNING_KEY_PASSWORD="$ANDROID_SIGNING_STORE_PASSWORD"
          (
            cd apps/tv-android
            ./gradlew --no-daemon --no-configuration-cache \
              clean :app:testDebugUnitTest :app:assembleRelease
          )
          apk="apps/tv-android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          [[ -f "$apk" && -x "$apksigner" ]]
          verify_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<<"$verify_output"
          expected_certificate="$(tr -d '[:space:]' < apps/tv-android/signing-certificate-sha256.txt)"
          actual_certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$verify_output")"
          [[ "$actual_certificate" == "$expected_certificate" ]] || {
            echo "Empreinte du certificat Android TV inattendue." >&2
            exit 1
          }
          mkdir -p dist
          install -m 0644 "$apk" "dist/roomframe-tv-android-${GITHUB_REF_NAME}.apk"
      - name: Create source package
        run: |
          mkdir -p dist
          tar \
            --exclude-vcs \
            --exclude-from=scripts/source-excludes.txt \
            -czf "dist/roomframe-tv-${GITHUB_REF_NAME}.tar.gz" .
      - name: Build autonomous installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          ARCHIVE_PATH="dist/roomframe-tv-${GITHUB_REF_NAME}.tar.gz" \
          ./scripts/build-release-installer.sh
      - name: Build SPDX 2.3 SBOM
        run: |
          version="${GITHUB_REF_NAME#v}"
          created_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          python scripts/build-sbom.py \
            --version "$version" \
            --source-archive "dist/roomframe-tv-${GITHUB_REF_NAME}.tar.gz" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --created-at "$created_at" \
            --output "dist/roomframe-tv-${GITHUB_REF_NAME}.spdx.json"
      - name: Build and verify signed update
        env:
          SIGNING_KEY_B64: ${{ secrets.ROOMFRAME_RELEASE_SIGNING_KEY_B64 }}
          SIGNING_KEY_ID: ${{ vars.ROOMFRAME_RELEASE_KEY_ID }}
        run: |
          if [[ -z "$SIGNING_KEY_B64" ]]; then
            echo "Le secret ROOMFRAME_RELEASE_SIGNING_KEY_B64 est requis pour publier." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          android_version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' apps/tv-android/app/build.gradle.kts)"
          android_certificate="$(tr -d '[:space:]' < apps/tv-android/signing-certificate-sha256.txt)"
          key_id="${SIGNING_KEY_ID:-release-main}"
          key_file="$RUNNER_TEMP/roomframe-release-private.pem"
          public_key="$RUNNER_TEMP/roomframe-release-public.pem"
          published_key="dist/roomframe-release-${key_id}.pem"
          trap 'rm -f "$key_file" "$public_key"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode >"$key_file"
          chmod 0600 "$key_file"
          openssl pkey -in "$key_file" -pubout -out "$public_key"
          install -m 0644 "$public_key" "$published_key"
          sha256sum "$published_key" >"${published_key}.sha256"
          python scripts/build-signed-update.py \
            --artifact "dist/roomframe-tv-${GITHUB_REF_NAME}.tar.gz" \
            --sbom "dist/roomframe-tv-${GITHUB_REF_NAME}.spdx.json" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --home-apk "dist/roomframe-tv-android-${GITHUB_REF_NAME}.apk" \
            --home-package org.roomframe.tv \
            --home-version-code "$android_version_code" \
            --home-signing-cert-sha256 "$android_certificate" \
            --version "$version" \
            --private-key "$key_file" \
            --key-id "$key_id" \
            --output "dist/roomframe-tv-${GITHUB_REF_NAME}.rfupdate"
          python scripts/verify-update-bundle.py \
            "dist/roomframe-tv-${GITHUB_REF_NAME}.rfupdate" \
            --trust-key "$public_key"
      - name: Attest release provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/roomframe-install.sh
            dist/roomframe-tv-${{ github.ref_name }}.tar.gz
            dist/roomframe-tv-${{ github.ref_name }}.rfupdate
            dist/roomframe-tv-${{ github.ref_name }}.spdx.json
            dist/roomframe-tv-android-${{ github.ref_name }}.apk
      - name: Attest signed update SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/roomframe-tv-${{ github.ref_name }}.rfupdate
          sbom-path: dist/roomframe-tv-${{ github.ref_name }}.spdx.json
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/roomframe-install.sh
            dist/roomframe-tv-*.tar.gz
            dist/roomframe-tv-*.rfupdate
            dist/roomframe-tv-*.spdx.json
            dist/roomframe-tv-android-*.apk
            dist/roomframe-release-*.pem
            dist/roomframe-release-*.pem.sha256
            bundles/roomframe-default-experience-1.0.0.rfbundle
