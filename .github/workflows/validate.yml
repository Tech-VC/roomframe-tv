name: validate
on:
  push:
  pull_request:

jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Check and test RoomFrame
        run: ./scripts/test.sh
      - name: Smoke-test installer idempotence
        run: |
          test_root="$(mktemp -d)"
          cleanup_test_root() {
            sudo find "$test_root" -depth -mindepth 1 -delete
            sudo rmdir "$test_root"
          }
          trap cleanup_test_root EXIT
          mkdir -p local-branding local-hardware
          printf '%s\n' private-test-only > local-branding/private-test-only.txt
          printf '%s\n' private-test-only > local-hardware/private-test-only.txt
          printf '%s\n' local-agent-instructions > AGENTS.md
          printf '%s\n' apple-double-test > prototype/admin/._private-test-only.js
          printf '%s\n' finder-test > prototype/admin/.DS_Store
          real_ip="$(command -v ip)"
          mkdir "$test_root/bin"
          printf '%s\n' \
            '#!/bin/sh' \
            'if [ "$*" = "-4 route get 1.1.1.1" ]; then exit 2; fi' \
            "exec \"$real_ip\" \"\$@\"" \
            > "$test_root/bin/ip"
          chmod 0755 "$test_root/bin/ip"
          sudo env \
            PATH="$test_root/bin:$PATH" \
            ROOMFRAME_INSTALL_DIR="$test_root/install" \
            ROOMFRAME_CONFIG_DIR="$test_root/config" \
            ROOMFRAME_DATA_DIR="$test_root/data" \
            ROOMFRAME_SKIP_COMMAND_LINKS=1 \
            ROOMFRAME_SKIP_SYSTEMD_UNITS=1 \
            ./install.sh --source "$PWD" --host roomframe.example.test --no-start
          before="$(
            sudo find "$test_root/config/secrets" \
              -mindepth 1 -maxdepth 1 -type f \
              -printf '%f:%i:%Y:%s\n' | sort
          )"
          sudo env \
            ROOMFRAME_INSTALL_DIR="$test_root/install" \
            ROOMFRAME_CONFIG_DIR="$test_root/config" \
            ROOMFRAME_DATA_DIR="$test_root/data" \
            ROOMFRAME_SKIP_COMMAND_LINKS=1 \
            ROOMFRAME_SKIP_SYSTEMD_UNITS=1 \
            ./install.sh --source "$PWD" --host roomframe.example.test --no-start
          after="$(
            sudo find "$test_root/config/secrets" \
              -mindepth 1 -maxdepth 1 -type f \
              -printf '%f:%i:%Y:%s\n' | sort
          )"
          test "$before" = "$after"
          sudo test -f "$test_root/config/runtime.conf"
          sudo test -f "$test_root/data/seed/default-experience/manifest.json"
          sudo test ! -e "$test_root/install/AGENTS.md"
          sudo test ! -e "$test_root/install/local-branding"
          sudo test ! -e "$test_root/install/local-hardware"
          sudo test ! -e "$test_root/install/prototype/admin/._private-test-only.js"
          sudo test ! -e "$test_root/install/prototype/admin/.DS_Store"
          openssl genpkey -algorithm ED25519 -out "$test_root/update-test-private.pem"
          openssl pkey \
            -in "$test_root/update-test-private.pem" \
            -pubout \
            -out "$test_root/update-test-public.pem"
          update_key_sha="$(sha256sum "$test_root/update-test-public.pem" | awk '{print $1}')"
          sudo env \
            ROOMFRAME_RUNTIME_CONFIG="$test_root/config/runtime.conf" \
            ./scripts/roomframe-trust-update-key.sh \
              --key-id ci-test \
              --public-key "$test_root/update-test-public.pem" \
              --sha256 "$update_key_sha"
          if sudo env \
            ROOMFRAME_RUNTIME_CONFIG="$test_root/config/runtime.conf" \
            ./scripts/roomframe-trust-update-key.sh \
              --revoke \
              --key-id ci-test \
              --sha256 "$(printf '0%.0s' {1..64})"
          then
            echo 'Une révocation avec une mauvaise empreinte a été acceptée.' >&2
            exit 1
          fi
          sudo test -f "$test_root/data/pki/update-trust/ci-test.pem"
          sudo env \
            ROOMFRAME_RUNTIME_CONFIG="$test_root/config/runtime.conf" \
            ./scripts/roomframe-trust-update-key.sh \
              --revoke \
              --key-id ci-test \
              --sha256 "$update_key_sha"
          sudo test ! -e "$test_root/data/pki/update-trust/ci-test.pem"
          sudo find "$test_root/data/pki/update-revoked" \
            -mindepth 1 -maxdepth 1 -type f \
            -name "ci-test-*-${update_key_sha}.pem" \
            -print -quit \
            | grep -q .
      - name: Reject private artifacts and local identifiers
        run: |
          forbidden_paths="$(
            git ls-files \
              | grep -Ei \
                '(^|/)(AGENTS\.md|local-branding|local-hardware|node_modules|\.env[^/]*)(/|$)|\.(pem|key|crt|p12|jks|keystore|rfupdate|apk|aab)$' \
              || true
          )"
          if [[ -n "$forbidden_paths" ]]; then
            printf '%s\n' "$forbidden_paths" >&2
            echo 'Des artefacts locaux ou sensibles sont suivis par Git.' >&2
            exit 1
          fi
          if git ls-files -z -- . ':(exclude).github/workflows/validate.yml' \
            | xargs -0 grep \
                --line-number \
                --extended-regexp \
                --binary-files=without-match \
                '(/Users/|/home/[A-Za-z0-9._-]+/|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|(^|[^0-9])10\.([0-9]{1,3}\.){2}[0-9]{1,3}([^0-9]|$)|(^|[^0-9])192\.168\.([0-9]{1,3}\.)[0-9]{1,3}([^0-9]|$)|(^|[^0-9])172\.(1[6-9]|2[0-9]|3[01])\.([0-9]{1,3}\.)[0-9]{1,3}([^0-9]|$))'
          then
            echo 'Un secret potentiel, chemin local ou identifiant réseau privé a été trouvé.' >&2
            exit 1
          fi
