name: validate
on:
  push:
  pull_request:

jobs:
  starter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: roomframe_test
          POSTGRES_USER: roomframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomframe -d roomframe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Check and test RoomFrame
        env:
          ROOMFRAME_TEST_DB_HOST: 127.0.0.1
          ROOMFRAME_TEST_DB_PORT: "5432"
          ROOMFRAME_TEST_DB_NAME: roomframe_test
          ROOMFRAME_TEST_DB_USER: roomframe
        run: ./scripts/test.sh
      - name: Smoke-test installer idempotence
        run: |
          test_root="$(mktemp -d)"
          cleanup_test_root() {
            sudo find "$test_root" -depth -mindepth 1 -delete
            sudo rmdir "$test_root"
          }
          trap cleanup_test_root EXIT
          sudo env \
            ROOMFRAME_INSTALL_DIR="$test_root/install" \
            ROOMFRAME_CONFIG_DIR="$test_root/config" \
            ROOMFRAME_DATA_DIR="$test_root/data" \
            ROOMFRAME_SKIP_COMMAND_LINKS=1 \
            ./install.sh --source "$PWD" --host roomframe.example.test --no-start
          before="$(
            sudo find "$test_root/config/secrets" \
              -mindepth 1 -maxdepth 1 -type f \
              -printf '%f:%i:%Y:%s\n' | sort
          )"
          sudo env \
            ROOMFRAME_INSTALL_DIR="$test_root/install" \
            ROOMFRAME_CONFIG_DIR="$test_root/config" \
            ROOMFRAME_DATA_DIR="$test_root/data" \
            ROOMFRAME_SKIP_COMMAND_LINKS=1 \
            ./install.sh --source "$PWD" --host roomframe.example.test --no-start
          after="$(
            sudo find "$test_root/config/secrets" \
              -mindepth 1 -maxdepth 1 -type f \
              -printf '%f:%i:%Y:%s\n' | sort
          )"
          test "$before" = "$after"
          test -f "$test_root/config/runtime.conf"
          test -f "$test_root/data/seed/default-experience/manifest.json"
      - name: Ensure neutral public defaults
        run: |
          if grep \
            --recursive \
            --line-number \
            --ignore-case \
            --extended-regexp \
            --exclude='.env*' \
            'septem|montrichard|51 rue des bois' \
            defaults examples apps services prototype README.md docs; then
            echo 'Des données spécifiques à une instance ont été trouvées.' >&2
            exit 1
          fi
